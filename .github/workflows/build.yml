name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish single-file executable
        run: >
          dotnet publish src/BeastClicker
          -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BeastClicker
          path: dist/BeastClicker.exe
          if-no-files-found: error

# The benchmark suite is intentionally not run in CI: it synthesises real mouse
# input and needs an interactive desktop session, so it has to be run locally.
