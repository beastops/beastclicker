name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.1.0)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      # Provenance attestation: lets anyone verify a downloaded binary was built
      # by this workflow from this commit, which is the only claim about an
      # unsigned executable that a user can actually check for themselves.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish framework-dependent build
        run: >
          dotnet publish src/BeastClicker
          -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o dist

      - name: Publish standalone build (runtime included)
        run: >
          dotnet publish src/BeastClicker
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o dist-standalone
        # IncludeNativeLibrariesForSelfExtract matters here: without it WPF's
        # native DLLs sit beside the exe instead of inside it.

      - name: Name the standalone build distinctly
        run: Move-Item dist-standalone/BeastClicker.exe dist/BeastClicker-Standalone.exe
        shell: pwsh

      - name: Build MSIX
        run: dotnet run --project tools/BeastClicker.Tools -c Release -- msix

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/BeastClicker.exe
            dist/BeastClicker-Standalone.exe
            dist/BeastClicker.msix

      - name: Write checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Include BeastClicker*.exe,BeastClicker.msix -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }
          # Written with LF explicitly. Set-Content ends lines with CRLF on
          # Windows, and sha256sum -c on Linux and macOS reads the trailing CR as
          # part of the filename, so every entry comes back as missing. 3.2.0
          # shipped a checksum file that verified nothing for exactly this reason.
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'dist/SHA256SUMS.txt'), ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/BeastClicker-Standalone.exe
            dist/BeastClicker.exe
            dist/BeastClicker.msix
            dist/BeastClicker.cer
            dist/SHA256SUMS.txt

# Note: the MSIX is signed with a certificate generated on the runner, so its
# thumbprint differs every build. That is fine for a self-signed package, since
# users must trust the accompanying .cer either way, but it means the certificate is
# not stable across releases. A real CA certificate would fix that and remove the
# trust step entirely.
